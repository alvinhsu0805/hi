<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>離線表頭辨識</title>
  <style>
    :root {
      --bg: #eef3f1;
      --ink: #152028;
      --accent: #0b5f73;
      --card: #ffffff;
      --line: #c9d5d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #d9ebe7 0%, transparent 45%), var(--bg);
      min-height: 100vh;
    }
    main { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .sub { color: #516071; line-height: 1.6; margin-bottom: 20px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
    }
    label { display:block; font-weight:700; margin-bottom:8px; }
    input[type=file] {
      width: 100%;
      padding: 14px;
      border: 1.5px dashed #8aa0a8;
      border-radius: 10px;
      background: #f7fbfb;
    }
    button, .btn {
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-top: 14px;
      margin-right: 8px;
    }
    .btn.secondary { background: #2f3b4a; }
    .chip {
      display: inline-block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      margin: 4px 4px 0 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>離線表頭辨識</h1>
    <p class="sub">
      在瀏覽器操作（不需本機 Tk 視窗）。先辨識型號、批號、作業人員，確認後寫入 Excel。
      使用 EasyOCR，可離線；第一次較慢。
    </p>
    <section class="panel">
      <form action="/offline/recognize" method="post" enctype="multipart/form-data">
        <label for="image">上傳表頭／整張表單照片</label>
        <input id="image" name="image" type="file" accept="image/*" capture="environment" required />
        <button type="submit">開始離線辨識</button>
        <a class="btn secondary" href="/files/outputs/header_offline.xlsx">下載表頭 Excel</a>
        <a class="btn secondary" href="/">回首頁</a>
      </form>
    </section>
    <p style="margin-top:18px">
      <span class="chip">型號 XX-XXXXX-XXX</span>
      <span class="chip">批號 26-07-341 → 20260700341</span>
      <span class="chip">作業人員 5 碼</span>
    </p>
  </main>
</body>
</html>
